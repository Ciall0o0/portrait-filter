name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ---- Node.js (frontend) ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install frontend deps
        run: cd frontend && npm ci --prefer-offline

      # ---- Rust (Tauri) ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/target
          key: rust-${{ runner.os }}-${{ hashFiles('frontend/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      # ---- Python (backend + PyInstaller) ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            backend/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Build backend with PyInstaller
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple/
        run: |
          cd backend
          uv sync
          uv run pyinstaller `
            --onefile `
            --name portrait-filter-backend-x86_64-pc-windows-msvc `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.auto `
            --hidden-import anyio._backends._asyncio `
            --hidden-import pydantic_settings `
            --hidden-import aiosqlite `
            --hidden-import openai `
            --hidden-import httpx `
            --hidden-import send2trash `
            --hidden-import aiofiles `
            --hidden-import PIL `
            --hidden-import fastapi `
            launcher.py

      # ---- Tauri build (compiles Rust + bundles NSIS installer) ----
      - name: Build Tauri app
        run: cd frontend && npm run tauri build

      # ---- Upload artifact ----
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Portrait-Filter-Windows-Installer
          path: frontend/target/release/bundle/nsis/*.exe

      - name: Upload portable EXE (standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Portrait-Filter-Windows-Portable
          path: frontend/target/release/portrait-filter.exe
